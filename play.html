<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Memento Game Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="play-page">
    <div class="game-container">
        <a href="index.html" class="back-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>

        <header class="logo-header">
            <div class="logo-badge">
                <img src="/Logo5.png" alt="Memento Logo" class="main-logo-img">
            </div>
        </header>

        <div class="play-content-wrapper">
            <h1 class="play-title">Play</h1>

            <div class="play-carousel">
                <div class="play-card side-outer left"></div>
                <div class="play-card side-inner left"></div>
                <div class="play-card central-focus"></div>
                <div class="play-card side-inner right"></div>
                <div class="play-card side-outer right"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</body>
</html>
